<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <!-- Connection to external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-card">
    <h1 class="todo-title">Todo App</h1>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        id="todoInput" 
        class="todo-input" 
        placeholder="What needs doing?" 
        autocomplete="off"
      >
      <button id="addBtn" class="btn btn-primary">Add</button>
    </div>

    <!-- Sub-bar: Instructions & Filter Buttons -->
    <div class="filter-section">
      <span class="tip-text">Tip: double-click a todo to edit. Press Enter to save.</span>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- Todo List Items -->
    <ul id="todoList" class="todo-list">
      <!-- Items dynamically rendered by app.js -->
    </ul>

    <!-- Bottom Footer -->
    <div class="footer-section">
      <span id="itemsLeft" class="items-left">0 items left</span>
      <div class="action-buttons">
        <button id="clearCompletedBtn" class="btn btn-secondary">Clear completed</button>
        <button id="clearAllBtn" class="btn btn-secondary">Clear all</button>
      </div>
    </div>
  </div>

  <!-- Connection to external JavaScript file -->
  <script src="app.js" defer></script>
</body>
</html>
